<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Busca Moderna (com Autocomplete)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #1e293b;
      --border: #cbd5e1;
      --primary: #1d4ed8;
      --highlight: #fef3c7;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .search-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      gap: 8px;
      margin-bottom: 24px;
      position: relative;
    }

    #searchInput {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    #searchInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
    }

    /* Autocomplete dropdown */
    .autocomplete-items {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 999;
      max-height: 200px;
      overflow-y: auto;
      font-size: 15px;
    }

    .autocomplete-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover {
      background-color: #f1f5f9;
    }

    #searchButton {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    #searchButton:hover {
      background-color: #1e40af;
      transform: translateY(-1px);
    }

    #searchButton:active {
      transform: translateY(0);
    }

    #results {
      width: 100%;
      max-width: 600px;
      font-size: 15px;
    }

    .result {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .result:last-child {
      border-bottom: none;
    }

    .highlight {
      background-color: var(--highlight);
      border-radius: 4px;
      padding: 0 3px;
      font-weight: 700;
    }

    /* Responsivo */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.4rem;
      }

      .search-wrapper {
        gap: 6px;
      }

      #searchInput,
      #searchButton {
        font-size: 15px;
      }

      #searchButton {
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Busca Moderna</h1>
  </header>

  <div class="search-wrapper">
    <input
      type="text"
      id="searchInput"
      placeholder="Digite uma palavra‑chave (autocomplete ativado)"
    />
    <!-- Dropdown de autocomplete -->
    <div id="autocompleteList" class="autocomplete-items"></div>

    <button id="search.populateSuggestions(dados, termos); // carrega sugestões conforme digita

      buscar(searchInput.value.trim());
      // oculta dropdown ao buscar
      document.getElementById("autocompleteList").style.display = "none";
    });
  </script>
</body>
</html>
